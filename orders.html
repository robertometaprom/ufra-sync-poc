<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAXXIA · Mis pedidos</title><style>:root{--bg:#f7f5f2;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e4df}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:900px;margin:auto;padding:0 24px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.top .shell{width:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:.18em}.link{color:#333;text-decoration:none}.page{padding:42px 0 70px}h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:0 0 10px}.intro{color:var(--muted);margin:0 0 28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:18px;align-items:center}.id{font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:7px}.amount{font-size:20px;font-weight:800;white-space:nowrap}.status{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#f2eee9;font-size:12px;font-weight:700}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;line-height:1.5}@media(max-width:560px){.shell{padding:0 14px}h1{font-size:40px}.row{align-items:flex-start}.amount{font-size:17px}}</style></head><body><header class="top"><div class="shell"><div class="brand">SHAXXIA</div><a class="link" href="/">← Volver a la tienda</a></div></header><main class="shell page"><h1>Mis pedidos</h1><p class="intro">Tus compras asociadas a esta cuenta.</p><div id="root" class="empty">Cargando tus pedidos…</div></main><script>(()=>{const AUTH_KEY='shaxx_auth_v1',SB_URL='https://yfbuxelsdpucmtxnuazv.supabase.co',SB_KEY='sb_publishable_Oj2nv9h1zLVuiBqEndPgLg_0P64QJhq',root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=(n,c='MXN')=>new Intl.NumberFormat('es-MX',{style:'currency',currency:c,maximumFractionDigits:0}).format(n);function load(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{return null}}function save(v){if(v)localStorage.setItem(AUTH_KEY,JSON.stringify(v));else localStorage.removeItem(AUTH_KEY)}async function token(){let s=load();if(!s)return null;if(s.expires_at&&Date.now()<=s.expires_at-60000)return s.access_token||null;if(!s.refresh_token){save(null);return null}try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})}),d=await r.json();if(!r.ok||!d.access_token)throw new Error();s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user,expires_at:Date.now()+((d.expires_in||3600)*1000)};save(s);return s.access_token}catch{save(null);return null}}function label(o){if(o.paymentStatus==='paid')return'Pagado';if(o.paymentStatus==='failed')return'Pago fallido';return'Pendiente de pago'}async function run(){const t=await token();if(!t){root.innerHTML='Inicia sesión desde la tienda para consultar tus pedidos.';return}try{const r=await fetch('/api/create-order',{headers:{Authorization:'Bearer '+t}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudieron cargar tus pedidos');const a=d.orders||[];if(!a.length){root.innerHTML='Todavía no tienes pedidos asociados a esta cuenta.';return}root.className='';root.innerHTML=a.map(o=>`<article class="card"><div class="row"><div><div class="id">Pedido ${esc(o.id.slice(0,8).toUpperCase())}</div><div class="meta">${new Date(o.createdAt).toLocaleString('es-MX')}</div><span class="status">${esc(label(o))}</span></div><div class="amount">${money(o.total,o.currency||'MXN')}</div></div></article>`).join('')}catch(e){root.innerHTML=esc(e.message)}}run()})();</script></body></html>
