<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfumería · Producto</title><style>:root{--bg:#f7f5f2;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e4df;--ok:#26734d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1280px;margin:auto;padding:0 24px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.top .shell{width:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:.18em}.cartlink{color:#222;text-decoration:none;font-weight:700}.back{display:inline-block;margin:30px 0 18px;color:#555;text-decoration:none}.product{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:58px;align-items:start;padding-bottom:70px}.gallery{display:grid;grid-template-columns:88px 1fr;gap:16px}.thumbs{display:flex;flex-direction:column;gap:10px}.thumb{width:88px;height:88px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;cursor:pointer}.thumb.active{border:2px solid #111}.thumb img{width:100%;height:100%;object-fit:contain}.mainimg{background:#fff;border:1px solid var(--line);border-radius:22px;min-height:600px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mainimg img{width:100%;height:600px;object-fit:contain;transition:transform .25s}.mainimg:hover img{transform:scale(1.12)}.info{padding-top:24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:#777;font-weight:700}.info h1{font-family:Georgia,serif;font-size:44px;line-height:1.08;font-weight:500;margin:12px 0 20px}.details{color:#666;font-size:14px;margin-bottom:26px}.prices{display:flex;align-items:baseline;gap:12px}.price{font-size:34px;font-weight:800}.compare{text-decoration:line-through;color:#999;font-size:17px}.stock{margin:18px 0;color:var(--ok);font-weight:600}.cta{width:100%;border:0;border-radius:13px;padding:16px;background:#111;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.cta:disabled{opacity:.35;cursor:not-allowed}.cta.added{background:#26734d}.note{font-size:12px;color:#888;line-height:1.5;margin-top:12px}.error{padding:22px;background:#fff1f1;border:1px solid #efc9c9;border-radius:14px;color:#922}@media(max-width:850px){.product{grid-template-columns:1fr;gap:24px}.gallery{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto}.mainimg{min-height:430px}.mainimg img{height:430px}.info h1{font-size:36px}}@media(max-width:480px){.shell{padding:0 14px}.mainimg{min-height:360px}.mainimg img{height:360px}}</style></head><body><header class="top"><div class="shell"><div class="brand">PERFUMERÍA</div><a class="cartlink" href="/cart.html">Carrito <span id="cartCount">0</span></a></div></header><main class="shell"><a class="back" href="/">← Volver al catálogo</a><div id="root"><div>Cargando producto…</div></div></main><script>(()=>{const KEY='ufra-commerce-cart-v1',root=document.getElementById('root'),id=new URLSearchParams(location.search).get('id'),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function cart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function count(){document.getElementById('cartCount').textContent=cart().reduce((s,x)=>s+Number(x.qty||1),0)}function add(p){const c=cart(),i=c.findIndex(x=>x.id===p.id);if(i>=0)c[i].qty=(c[i].qty||1)+1;else c.push({id:p.id,sku:p.sku,name:p.name,brand:p.brand,sizeMl:p.sizeMl,image:(p.images?.[0]||p.image||null),salePrice:p.salePrice,qty:1});localStorage.setItem(KEY,JSON.stringify(c));count();const b=document.getElementById('addBtn');b.textContent='Agregado ✓';b.classList.add('added');setTimeout(()=>{b.textContent='Agregar al carrito';b.classList.remove('added')},900)}async function load(){try{if(!id)throw new Error('Producto no especificado');const r=await fetch(`/api/product?id=${encodeURIComponent(id)}&t=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);const p=d.product,imgs=p.images?.length?p.images:[p.image].filter(Boolean),detail=[p.fragranceType,p.sizeMl?`${p.sizeMl} ml`:null,p.gender].filter(Boolean).join(' · '),compare=p.compareAtPrice?`<span class="compare">${money(p.compareAtPrice)}</span>`:'';root.innerHTML=`<section class="product"><div class="gallery"><div class="thumbs">${imgs.map((u,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${esc(u)}" alt=""></button>`).join('')}</div><div class="mainimg"><img id="mainImage" src="${esc(imgs[0]||'')}" alt="${esc(p.name)}"></div></div><div class="info"><div class="eyebrow">${esc(p.brand||'Fragancia')}</div><h1>${esc(p.name||'Producto')}</h1><div class="details">${esc(detail)}</div><div class="prices"><span class="price">${money(p.salePrice)}</span>${compare}</div><div class="stock">${p.inStock?'✓ Disponible':'Temporalmente no disponible'}</div><button id="addBtn" class="cta" ${p.inStock?'':'disabled'}>${p.inStock?'Agregar al carrito':'No disponible'}</button><div class="note">La disponibilidad y el precio se validarán nuevamente antes de confirmar la compra.</div></div></section>`;document.title=`${p.name||'Producto'} · Perfumería`;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('mainImage').src=imgs[Number(b.dataset.i)]});if(p.inStock)document.getElementById('addBtn').onclick=()=>add(p)}catch(e){root.innerHTML=`<div class="error">No se pudo cargar el producto: ${esc(e.message)}</div>`}}count();load()})();</script></body></html>
