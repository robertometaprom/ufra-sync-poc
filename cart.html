<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfumería · Carrito</title><style>:root{--bg:#f7f5f2;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e4df;--ok:#26734d;--warn:#7b5a13;--bad:#9d2b2b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.top .shell{width:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:.18em}.link{color:#333;text-decoration:none}.page{padding:42px 0 70px}.page h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:0 0 30px}.layout{display:grid;grid-template-columns:1fr 360px;gap:28px}.items{display:flex;flex-direction:column;gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center}.item img{width:110px;height:110px;object-fit:contain;background:#faf9f7;border-radius:12px}.name{font-weight:700;margin-bottom:6px}.meta{font-size:13px;color:#777}.qty{display:flex;align-items:center;gap:8px;margin-top:12px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.remove{margin-top:10px;border:0;background:none;padding:0;color:#a04b4b;cursor:pointer;font-size:12px}.itemprice{font-weight:800;font-size:18px}.summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;position:sticky;top:20px}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0}.total{border-top:1px solid var(--line);margin-top:8px;padding-top:16px;font-size:20px;font-weight:800}.checkout{width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;background:#111;color:#fff;font-weight:800;cursor:pointer}.checkout:disabled{opacity:.45;cursor:wait}.note{font-size:12px;color:#777;line-height:1.5;margin-top:12px}.empty{background:#fff;border:1px solid var(--line);padding:30px;border-radius:18px}.empty a{color:#111;font-weight:700}.warning,.ok,.bad{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.45}.warning{background:#fff7e7;color:var(--warn)}.ok{background:#edf8f1;color:#236442}.bad{background:#fff1f1;color:var(--bad)}.small{font-size:12px;color:#777;margin-top:4px}@media(max-width:820px){.layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:560px){.shell{padding:0 14px}.item{grid-template-columns:85px 1fr}.item img{width:85px;height:85px}.itemprice{grid-column:2}.page h1{font-size:40px}}</style></head><body><header class="top"><div class="shell"><div class="brand">PERFUMERÍA</div><a class="link" href="/">Seguir comprando</a></div></header><main class="shell page"><h1>Tu carrito</h1><div id="root"></div></main><script>(()=>{const KEY='ufra-commerce-cart-v1',root=document.getElementById('root'),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(c){localStorage.setItem(KEY,JSON.stringify(c));render()}function render(){const c=get();if(!c.length){root.innerHTML='<div class="empty">Tu carrito está vacío. <a href="/">Ver catálogo</a></div>';return}const subtotal=c.reduce((s,x)=>s+Number(x.salePrice||0)*Number(x.qty||1),0),count=c.reduce((s,x)=>s+Number(x.qty||1),0);root.innerHTML=`<div class="layout"><div class="items">${c.map((x,i)=>`<div class="item"><img src="${esc(x.image||'')}" alt=""><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.brand||'')} ${x.sizeMl?`· ${esc(x.sizeMl)} ml`:''}</div><div class="qty"><button data-action="minus" data-i="${i}">−</button><strong>${x.qty||1}</strong><button data-action="plus" data-i="${i}">+</button></div><button class="remove" data-action="remove" data-i="${i}">Eliminar</button></div><div class="itemprice">${money(Number(x.salePrice||0)*Number(x.qty||1))}</div></div>`).join('')}</div><aside class="summary"><div class="row"><span>Productos</span><strong>${count}</strong></div><div class="row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="row total"><span>Total</span><span>${money(subtotal)}</span></div><button id="checkout" class="checkout">Validar y continuar</button><div id="verifyBox" class="warning">Antes de cobrar, verificaremos en vivo disponibilidad y precio actual de cada producto.</div><div class="note">Todavía no se realiza ningún cobro. La siguiente pantalla de pago se habilitará después de una validación exitosa.</div></aside></div>`;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),a=b.dataset.action,c=get();if(!c[i])return;if(a==='plus')c[i].qty=Math.min(10,(c[i].qty||1)+1);if(a==='minus')c[i].qty=Math.max(1,(c[i].qty||1)-1);if(a==='remove')c.splice(i,1);save(c)});document.getElementById('checkout').onclick=verify}
async function verify(){const c=get(),btn=document.getElementById('checkout'),box=document.getElementById('verifyBox');btn.disabled=true;btn.textContent='Validando con proveedor…';box.className='warning';box.textContent='Consultando disponibilidad y precio actual…';try{const r=await fetch('/api/verify-cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:c.map(x=>({id:x.id,qty:x.qty||1}))})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);if(!d.allValid){const problems=(d.items||[]).filter(x=>!x.valid).map(x=>`${x.name||'Producto'}: ${x.reason||'no disponible'}`);box.className='bad';box.innerHTML=`No podemos continuar todavía.<div class="small">${problems.map(esc).join('<br>')}</div>`;btn.textContent='Volver a validar';return}let changed=false;const latest=new Map(d.items.map(x=>[x.id,x]));const updated=c.map(x=>{const v=latest.get(x.id);if(v&&Number(v.currentSalePrice)!==Number(x.salePrice)){changed=true;return{...x,salePrice:v.currentSalePrice}}return x});if(changed)localStorage.setItem(KEY,JSON.stringify(updated));box.className='ok';box.innerHTML=`✓ Todo confirmado en vivo. Total validado: <strong>${money(d.total)}</strong><div class="small">Disponibilidad y precio confirmados ahora.</div>`;btn.textContent='Listo para pago';if(changed)setTimeout(render,900)}catch(e){box.className='bad';box.textContent=`No se pudo completar la validación: ${e.message}`;btn.textContent='Reintentar validación'}finally{btn.disabled=false}}
render()})();</script></body></html>
