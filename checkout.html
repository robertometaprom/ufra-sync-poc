<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAXXIA · Checkout</title><style>:root{--bg:#f7f5f2;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e4df;--ok:#26734d;--bad:#9d2b2b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.top .shell{width:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:.18em}.link{color:#333;text-decoration:none}.page{padding:42px 0 70px}.page h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:0 0 30px}.layout{display:grid;grid-template-columns:1fr 360px;gap:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.section{margin-bottom:26px}.section h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#666;margin-bottom:6px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.summary{position:sticky;top:20px}.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.item img{width:64px;height:64px;object-fit:contain;background:#faf9f7;border-radius:10px}.itemname{font-size:13px;font-weight:700}.small{font-size:12px;color:#777;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.total{border-top:1px solid var(--line);margin-top:8px;padding-top:15px;font-size:20px;font-weight:800}.btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;background:#111;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:wait}.note,.ok,.bad{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.45}.note{background:#fff7e7;color:#7b5a13}.ok{background:#edf8f1;color:var(--ok)}.bad{background:#fff1f1;color:var(--bad)}@media(max-width:820px){.layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:560px){.shell{padding:0 14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.page h1{font-size:40px}}</style></head><body><header class="top"><div class="shell"><div class="brand">SHAXXIA</div><a class="link" href="/cart.html">← Volver al carrito</a></div></header><main class="shell page"><h1>Datos de envío</h1><div id="root"></div></main><script>(()=>{const KEY='ufra-commerce-cart-v1',AUTH_KEY='shaxx_auth_v1',SB_URL='https://yfbuxelsdpucmtxnuazv.supabase.co',SB_KEY='sb_publishable_Oj2nv9h1zLVuiBqEndPgLg_0P64QJhq',root=document.getElementById('root'),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function cart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function loadAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{return null}}function saveAuth(v){if(v)localStorage.setItem(AUTH_KEY,JSON.stringify(v));else localStorage.removeItem(AUTH_KEY)}async function accessToken(){let s=loadAuth();if(!s)return null;if(s.expires_at&&Date.now()<=s.expires_at-60000)return s.access_token||null;if(!s.refresh_token){saveAuth(null);return null}try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})}),d=await r.json();if(!r.ok||!d.access_token)throw new Error('refresh failed');s={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user,expires_at:Date.now()+((d.expires_in||3600)*1000)};saveAuth(s);return s.access_token}catch{saveAuth(null);return null}}function render(){const c=cart();if(!c.length){root.innerHTML='<div class="card">Tu carrito está vacío. <a href="/">Volver al catálogo</a></div>';return}const subtotal=c.reduce((s,x)=>s+Number(x.salePrice||0)*Number(x.qty||1),0),cancelled=new URLSearchParams(location.search).get('cancelled')==='1',s=loadAuth(),u=s?.user||{},n=(u?.user_metadata?.full_name||u?.user_metadata?.name||u?.user_metadata?.given_name||'').trim(),em=u?.email||'';root.innerHTML=`<div class="layout"><form id="form" class="card"><div class="section"><h2>Contacto</h2><div class="grid"><div class="full"><label>Nombre completo</label><input name="name" required maxlength="160" value="${esc(n)}"></div><div><label>Email</label><input name="email" type="email" required maxlength="200" value="${esc(em)}"></div><div><label>Teléfono</label><input name="phone" required maxlength="60"></div></div></div><div class="section"><h2>Dirección de envío</h2><div class="grid"><div class="full"><label>Calle y número</label><input name="line1" required maxlength="200"></div><div class="full"><label>Interior / referencias</label><input name="line2" maxlength="200"></div><div><label>Ciudad / Municipio</label><input name="city" required maxlength="120"></div><div><label>Estado</label><input name="state" required maxlength="120"></div><div><label>Código postal</label><input name="postalCode" required maxlength="20"></div><div><label>País</label><input value="México" disabled></div></div></div><button id="submit" class="btn" type="submit">Continuar a pago seguro</button><div id="status" class="${cancelled?'bad':'note'}">${cancelled?'El pago fue cancelado. No se realizó ningún cobro. Puedes intentarlo nuevamente.':'Antes de cobrar volveremos a validar precio y disponibilidad en vivo. Después te enviaremos al pago seguro de Stripe.'}</div></form><aside class="card summary"><h2 style="margin-top:0">Resumen</h2>${c.map(x=>`<div class="item"><img src="${esc(x.image||'')}" alt=""><div><div class="itemname">${esc(x.name||'Producto')}</div><div class="small">${x.qty||1} × ${money(x.salePrice||0)}</div></div></div>`).join('')}<div class="row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="row"><span>Envío</span><strong>$0 prueba</strong></div><div class="row total"><span>Total prueba</span><span>${money(subtotal)}</span></div><div class="small">Entorno de prueba. El envío real con PyeM se integrará antes de activar cobros reales.</div></aside></div>`;document.getElementById('form').onsubmit=submit}
async function submit(e){e.preventDefault();const c=cart(),form=new FormData(e.currentTarget),btn=document.getElementById('submit'),status=document.getElementById('status');btn.disabled=true;btn.textContent='Verificando disponibilidad…';status.className='note';status.textContent='Consultando nuevamente al proveedor y preparando el pago seguro…';const payload={items:c.map(x=>({id:x.id,qty:x.qty||1})),customer:{name:form.get('name'),email:form.get('email'),phone:form.get('phone')},shippingAddress:{line1:form.get('line1'),line2:form.get('line2'),city:form.get('city'),state:form.get('state'),postalCode:form.get('postalCode')}};try{const token=await accessToken(),headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/create-order',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);localStorage.setItem('ufra-commerce-pending-order',d.order.id);btn.textContent='Abriendo Stripe…';status.className='ok';status.innerHTML=`✓ Producto y precio verificados.<br><strong>Orden ${esc(d.order.id.slice(0,8).toUpperCase())}</strong> · ${money(d.order.total)}<div class="small">Conectando con Stripe en modo prueba…</div>`;const sr=await fetch('/api/create-checkout-session',{method:'POST',headers,body:JSON.stringify({orderId:d.order.id})}),sd=await sr.json();if(!sr.ok||!sd.ok||!sd.url)throw new Error(sd.error||`Stripe HTTP ${sr.status}`);location.href=sd.url}catch(err){status.className='bad';status.textContent=`No se pudo iniciar el pago: ${err.message}`;btn.textContent='Reintentar';btn.disabled=false}}
render()})();</script></body></html>
