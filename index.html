<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UFRA Live Catalog POC</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f6f6;color:#111}main{max-width:1200px;margin:auto;padding:32px 20px}.top,.nav{display:flex;justify-content:space-between;gap:20px;align-items:center}.pill{background:#111;color:#fff;padding:8px 12px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}.card img{width:100%;height:220px;object-fit:contain}.price{font-size:24px;font-weight:700}.cost{color:#666}.ok{color:#087830}.bad{color:#b42318}button{background:#111;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}small{color:#666}.status{margin:16px 0}.nav{margin-top:28px;justify-content:center}.page{min-width:120px;text-align:center}</style></head>
<body><main><div class="top"><div><h1>UFRA → tienda: catálogo en vivo</h1><p>Consulta UFRA directamente, detecta precio/disponibilidad y aplica nuestro precio.</p></div><button id="reload">Actualizar esta página</button></div><div id="status" class="status">Cargando…</div><div class="nav"><button id="prev">← Anterior</button><strong id="page" class="page">Página 1</strong><button id="next">Siguiente →</button></div><div id="grid" class="grid"></div><div class="nav"><button id="prev2">← Anterior</button><strong id="page2" class="page">Página 1</strong><button id="next2">Siguiente →</button></div></main>
<script>
let currentPage=1,lastData=null;
const money=n=>n==null?'—':new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
function nav(){const total=lastData?.totalPages;for(const id of ['page','page2'])document.getElementById(id).textContent=`Página ${currentPage}${total?' de '+total:''}`;for(const id of ['prev','prev2'])document.getElementById(id).disabled=currentPage<=1;for(const id of ['next','next2'])document.getElementById(id).disabled=lastData?!lastData.hasNext:true;}
async function load(page=currentPage){const s=document.getElementById('status'),g=document.getElementById('grid');currentPage=page;s.textContent=`Consultando UFRA en vivo · página ${page}…`;g.innerHTML='';nav();try{const r=await fetch('/api/products?page='+page+'&t='+Date.now());const d=await r.json();if(!d.ok)throw new Error(d.error);lastData=d;const total=d.catalogTotal?`${d.catalogTotal.toLocaleString('es-MX')} productos detectados · `:'';s.innerHTML=`<span class="pill">${d.count} leídos ahora</span> <small>${total}${d.pricingRule}</small>`;for(const p of d.products){const el=document.createElement('div');el.className='card';if(p.error){el.innerHTML=`<b>Error de lectura</b><p class="bad">${p.error}</p>`}else{el.innerHTML=`${p.image?`<img src="${p.image}" alt="">`:''}<small>${p.brand||''} · SKU ${p.sku||'—'}</small><h3>${p.name||'Producto'}</h3><div class="price">${money(p.salePrice)}</div><div class="cost">Costo proveedor: ${money(p.supplierPrice)}</div><p class="${p.inStock?'ok':'bad'}">${p.inStock?'Disponible ahora':'No disponible'}</p>`}g.appendChild(el)}nav()}catch(e){lastData=null;s.innerHTML=`<span class="bad">${e.message}</span>`;nav()}}
function previous(){if(currentPage>1)load(currentPage-1)}function next(){if(!lastData||lastData.hasNext)load(currentPage+1)}
document.getElementById('reload').onclick=()=>load(currentPage);document.getElementById('prev').onclick=previous;document.getElementById('prev2').onclick=previous;document.getElementById('next').onclick=next;document.getElementById('next2').onclick=next;nav();load();
</script></body></html>
