<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UFRA Sync POC</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f6f6;color:#111}main{max-width:1100px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.pill{background:#111;color:#fff;padding:8px 12px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}.card img{width:100%;height:220px;object-fit:contain}.price{font-size:24px;font-weight:700}.cost{color:#666}.ok{color:#087830}.bad{color:#b42318}button{background:#111;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}small{color:#666}.status{margin-top:16px}</style></head>
<body><main><div class="top"><div><h1>UFRA → tienda: POC</h1><p>Lee 10 productos en vivo, detecta precio/disponibilidad y aplica margen.</p></div><button id="reload">Sincronizar ahora</button></div><div id="status" class="status">Cargando…</div><div id="grid" class="grid"></div></main>
<script>const money=n=>n==null?'—':new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);async function load(){const s=document.getElementById('status'),g=document.getElementById('grid');s.textContent='Consultando UFRA…';g.innerHTML='';try{const r=await fetch('/api/products?t='+Date.now());const d=await r.json();if(!d.ok)throw new Error(d.error);s.innerHTML=`<span class="pill">${d.count} productos</span> <small>${d.pricingRule}</small>`;for(const p of d.products){const el=document.createElement('div');el.className='card';if(p.error){el.innerHTML=`<b>Error de lectura</b><p class="bad">${p.error}</p>`}else{el.innerHTML=`${p.image?`<img src="${p.image}" alt="">`:''}<small>${p.brand||''} · SKU ${p.sku||'—'}</small><h3>${p.name||'Producto'}</h3><div class="price">${money(p.salePrice)}</div><div class="cost">UFRA: ${money(p.supplierPrice)}</div><p class="${p.inStock?'ok':'bad'}">${p.inStock?'Disponible':'No disponible'}</p>`}g.appendChild(el)}}catch(e){s.innerHTML=`<span class="bad">${e.message}</span>`}}document.getElementById('reload').onclick=load;load();</script></body></html>
