<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UFRA List Price Backfill</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;line-height:1.45}
    button{padding:10px 16px;margin-right:8px;cursor:pointer}
    .row{margin:14px 0}.muted{color:#666}pre{background:#f5f5f5;padding:14px;white-space:pre-wrap;max-height:420px;overflow:auto}
  </style>
</head>
<body>
  <h1>UFRA · Backfill Precio habitual</h1>
  <p>Actualiza <code>supplier_list_price</code> página por página usando el Precio habitual publicado por UFRA.</p>
  <div class="row">
    <button id="start">Iniciar / Reanudar</button>
    <button id="stop">Detener después de esta página</button>
  </div>
  <div id="status" class="row">Listo.</div>
  <div id="stats" class="row muted"></div>
  <pre id="log"></pre>
<script>
(() => {
  const CHECKPOINT_KEY = 'ufra-list-price-backfill-v1';
  const qs = new URLSearchParams(location.search);
  const saved = (() => { try { return JSON.parse(localStorage.getItem(CHECKPOINT_KEY) || 'null'); } catch { return null; } })();
  const requestedStart = Number(qs.get('startPage'));
  let page = Number.isFinite(requestedStart) && requestedStart > 0
    ? requestedStart
    : Math.max(1, Number(saved?.nextPage || 1));
  let stop = false;
  let running = false;
  let totalUpdated = Number(saved?.totalUpdated || 0);
  let totalMatched = Number(saved?.totalMatched || 0);
  let totalMissing = Number(saved?.totalMissing || 0);
  let totalNoList = Number(saved?.totalNoList || 0);
  const status = document.getElementById('status');
  const stats = document.getElementById('stats');
  const log = document.getElementById('log');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const line = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  const saveCheckpoint = () => {
    localStorage.setItem(CHECKPOINT_KEY, JSON.stringify({
      nextPage: page,
      totalUpdated,
      totalMatched,
      totalMissing,
      totalNoList,
      savedAt: new Date().toISOString()
    }));
  };
  const render = () => {
    status.textContent = running ? `Procesando página ${page}...` : `Listo para continuar en página ${page}.`;
    stats.textContent = `Actualizados acumulados: ${totalUpdated} · Coincidencias: ${totalMatched} · Faltantes DB: ${totalMissing} · Sin Precio habitual: ${totalNoList}`;
  };
  async function callPage(p) {
    let lastErr;
    for (let attempt=1; attempt<=3; attempt++) {
      try {
        const r = await fetch(`/api/list-prices?page=${p}&write=1`, {cache:'no-store'});
        const data = await r.json().catch(()=>({ok:false,error:`HTTP ${r.status}`}));
        if (!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);
        return data;
      } catch (e) {
        lastErr = e;
        line(`Página ${p}: intento ${attempt} falló: ${e.message}`);
        if (attempt < 3) await sleep(1500 * attempt);
      }
    }
    throw lastErr;
  }
  async function run() {
    if (running) return;
    running = true; stop = false; render();
    while (!stop && page <= 100) {
      try {
        const currentPage = page;
        const data = await callPage(currentPage);
        totalUpdated += data.updated || 0;
        totalMatched += data.matched || 0;
        totalMissing += data.missingInDb || 0;
        totalNoList += data.noListPrice || 0;
        line(`Página ${currentPage}: detectados ${data.detected}, actualizados ${data.updated}, faltantes ${data.missingInDb}, sin habitual ${data.noListPrice}, siguiente ${data.hasNext ? 'sí' : 'no'}`);
        page = currentPage + 1;
        saveCheckpoint();
        render();
        if (data.hasNext === false) {
          line(`FIN confirmado: UFRA no publica página siguiente después de la ${currentPage}.`);
          break;
        }
        await sleep(250);
      } catch (e) {
        if (/No UFRA product cards detected/i.test(e.message)) {
          line(`FIN: página ${page} sin productos. Catálogo terminado.`);
          break;
        }
        line(`DETENIDO en página ${page}: ${e.message}`);
        saveCheckpoint();
        break;
      }
    }
    running = false; saveCheckpoint(); render();
    if (stop) line(`Detenido por usuario. El checkpoint quedó guardado; reanudará en página ${page}.`);
  }
  document.getElementById('start').onclick = run;
  document.getElementById('stop').onclick = () => { stop = true; line('Se detendrá al terminar la página actual.'); };
  if (saved && !(Number.isFinite(requestedStart) && requestedStart > 0)) {
    line(`Checkpoint recuperado: próxima página ${page}.`);
  }
  render();
})();
</script>
</body>
</html>
