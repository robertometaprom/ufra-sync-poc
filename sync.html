<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UFRA Catalog Sync</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#111}
    button{font-size:16px;padding:12px 18px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .card{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:18px}
    .row{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0}
    .label{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.05em}
    .value{font-size:22px;font-weight:700;margin-top:3px}
    progress{width:100%;height:22px;margin:14px 0}
    pre{white-space:pre-wrap;background:#f6f6f6;padding:14px;border-radius:8px;max-height:280px;overflow:auto}
  </style>
</head>
<body>
  <h1>UFRA Catalog Sync</h1>
  <p>Un clic inicia la sincronización completa. El navegador encadena automáticamente batches pequeños y reanudables.</p>
  <p id="resumeNote"></p>
  <button id="start">Iniciar sincronización completa</button>
  <button id="stop" disabled>Detener después del batch actual</button>

  <div class="card">
    <div class="row">
      <div><div class="label">Estado</div><div class="value" id="status">Listo</div></div>
      <div><div class="label">Página</div><div class="value" id="page">—</div></div>
      <div><div class="label">Posición</div><div class="value" id="offset">—</div></div>
      <div><div class="label">Productos procesados</div><div class="value" id="processed">0</div></div>
      <div><div class="label">Errores</div><div class="value" id="errors">0</div></div>
    </div>
    <progress id="progress" max="100" value="0"></progress>
    <div class="label">Run ID</div><div id="runId">—</div>
  </div>

  <h3>Actividad</h3>
  <pre id="log">Esperando inicio…</pre>

<script>
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const statusEl = document.getElementById('status');
const pageEl = document.getElementById('page');
const offsetEl = document.getElementById('offset');
const processedEl = document.getElementById('processed');
const errorsEl = document.getElementById('errors');
const runIdEl = document.getElementById('runId');
const progressEl = document.getElementById('progress');
const logEl = document.getElementById('log');
const resumeNote = document.getElementById('resumeNote');
const qs = new URLSearchParams(location.search);
const STATE_KEY = 'ufra-catalog-sync-state-v1';

function loadSavedState(){
  try{return JSON.parse(localStorage.getItem(STATE_KEY)||'null')}catch{return null}
}
function saveState(state){
  try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch{}
}
function clearState(){
  try{localStorage.removeItem(STATE_KEY)}catch{}
}

const savedState = loadSavedState();
const explicitStartPage = Number.parseInt(qs.get('startPage') || '', 10);
const requestedStartPage = Math.max(1, Number.isFinite(explicitStartPage) ? explicitStartPage : Number(savedState?.page || 1));
const requestedRunId = qs.get('runId') || savedState?.runId || null;
const savedProcessed = requestedRunId && savedState?.runId === requestedRunId ? Number(savedState?.processed || 0) : 0;
const savedErrors = requestedRunId && savedState?.runId === requestedRunId ? Number(savedState?.errors || 0) : 0;

if (requestedRunId) {
  resumeNote.textContent = `Hay una sincronización pendiente. Se reanudará desde la página ${requestedStartPage}.`;
  startBtn.textContent = 'Reanudar sincronización';
  runIdEl.textContent = requestedRunId;
  pageEl.textContent = requestedStartPage;
  processedEl.textContent = savedProcessed;
  errorsEl.textContent = savedErrors;
} else if (requestedStartPage > 1) {
  resumeNote.textContent = `Reanudación configurada desde la página ${requestedStartPage}.`;
}

let stopRequested = false;
let running = false;
let processed = 0;
let totalErrors = 0;

function log(message) {
  const stamp = new Date().toLocaleTimeString();
  logEl.textContent = `[${stamp}] ${message}\n` + logEl.textContent;
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function callBatch(page, runId) {
  const params = new URLSearchParams({sync:'1', page:String(page)});
  if (runId) params.set('runId', runId);
  const response = await fetch(`/api/products?${params.toString()}`, {cache:'no-store'});
  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.ok) throw new Error(data?.error || `HTTP ${response.status}`);
  return data;
}

async function runAll() {
  if (running) return;
  running = true;
  stopRequested = false;
  processed = savedProcessed;
  totalErrors = savedErrors;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  statusEl.textContent = requestedRunId ? 'Reanudando' : 'Sincronizando';
  logEl.textContent = '';

  let page = requestedStartPage;
  let runId = requestedRunId;
  let consecutiveFailures = 0;
  const initialBase = (requestedStartPage - 1) * 24;
  log(requestedRunId ? `Reanudando Run ${requestedRunId} desde página ${requestedStartPage}.` : `Inicio desde página ${requestedStartPage}.`);

  try {
    while (!stopRequested) {
      let data;
      try {
        data = await callBatch(page, runId);
        consecutiveFailures = 0;
      } catch (err) {
        consecutiveFailures++;
        log(`Fallo temporal: ${err.message}. Reintento ${consecutiveFailures}/3.`);
        if (consecutiveFailures >= 3) throw err;
        await sleep(1500 * consecutiveFailures);
        continue;
      }

      const dbs = data.databaseSync;
      runId = dbs.runId;
      runIdEl.textContent = runId;
      pageEl.textContent = dbs.page;
      offsetEl.textContent = `${dbs.offset + dbs.batchSize} / ${data.pageSize}`;
      processed += dbs.saved;
      totalErrors += dbs.errors;
      processedEl.textContent = processed;
      errorsEl.textContent = totalErrors;

      const total = data.catalogTotal;
      if (total) {
        progressEl.max = total;
        progressEl.value = Math.min(initialBase + processed, total);
      } else {
        progressEl.max = 100;
        progressEl.value = ((dbs.offset + dbs.batchSize) / data.pageSize) * 100;
      }

      const resumePage = dbs.pageComplete ? dbs.nextPage : dbs.page;
      saveState({runId,page:resumePage,processed,errors:totalErrors,updatedAt:new Date().toISOString()});
      log(`Página ${dbs.page}, batch ${dbs.offset + 1}-${dbs.offset + dbs.batchSize}: ${dbs.saved} guardados, ${dbs.errors} errores.`);

      if (dbs.pageComplete) {
        if (!data.hasNext) {
          statusEl.textContent = 'Completado';
          log(`CATÁLOGO COMPLETO. Procesados en esta ejecución: ${processed}.`);
          clearState();
          break;
        }
        page = dbs.nextPage;
        log(`Página ${dbs.page} completa. Continuando con página ${page}.`);
      } else {
        page = dbs.nextPage;
      }
      await sleep(250);
    }

    if (stopRequested) {
      statusEl.textContent = 'Detenido';
      log('Detenido por el usuario. El checkpoint quedó guardado y podrá reanudarse al volver a abrir esta página.');
    }
  } catch (err) {
    statusEl.textContent = 'Error';
    log(`ERROR: ${err.message}. El checkpoint quedó guardado para reanudar.`);
  } finally {
    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }
}

startBtn.addEventListener('click', runAll);
stopBtn.addEventListener('click', () => { stopRequested = true; stopBtn.disabled = true; statusEl.textContent = 'Deteniendo…'; });
</script>
</body>
</html>
